[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.dependencies]
bevy = "0.19"
avian3d = "0.7.0"
rand = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lightyear = "0.28.0"
lightyear_avian3d = "0.28.0"
lightyear_inputs_leafwing = "0.28.0"
leafwing-input-manager = "0.21.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
block-mesh = "0.2.0"
ndshape = "0.3.0"
bevy_panorbit_camera = "0.35.0"
bevy-inspector-egui = "0.37.0"
bevy-tnua = "0.32.0"
bevy-tnua-avian3d = "0.12.0"
lk2-core = { path = "crates/core" }

[patch.crates-io]
parley = { path = "third_party/parley-0.9.0" }

[profile.dev]
opt-level = 1
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
