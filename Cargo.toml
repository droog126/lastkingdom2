[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
authors = ["Lastkingdom2 Contributors"]
description = "Wanguo Origins: Last Kingdom Diamond — Bevy voxel multiplayer sandbox"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/lastkingdom2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
similar_names = "allow"
too_many_arguments = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
needless_pass_by_value = "allow"
inline_always = "allow"

[workspace.lints.rust]
unsafe_code = "warn"
unused_qualifications = "warn"

[workspace.dependencies]
bevy = "0.19"
bevy_hanabi = "0.19.0"
avian3d = { version = "0.7.0", default-features = false }
rand = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lightyear = { version = "0.28.0", default-features = false }
lightyear_avian3d = "0.28.0"
lightyear_connection = { version = "0.28.0", default-features = false }
lightyear_inputs_leafwing = { version = "0.28.0", default-features = false }
lightyear_netcode = { version = "0.28.0", default-features = false }
leafwing-input-manager = "0.21.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bevy_world_serialization = "0.19.0"
bevy-tnua = "0.32.0"
bevy-tnua-avian3d = "0.12.0"
lk2-core = { path = "crates/core" }
insta = { version = "1", features = ["json"] }

[patch.crates-io]
parley = { path = "third_party/parley-0.9.0" }

[profile.dev]
opt-level = 1
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
