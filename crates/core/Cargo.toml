[package]
name = "lk2-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[features]
dev-dynamic-linking = ["bevy/dynamic_linking"]
client-render = ["bevy/bevy_pbr", "bevy/bevy_render"]
# Prototypes without a complete runtime producer/consumer path.
experimental-gameplay = []

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["default_app", "serialize"] }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
lightyear = { version = "0.28.0", default-features = false, features = ["std", "leafwing", "replication"] }
lightyear_inputs_leafwing = { version = "0.28.0", default-features = false, features = ["std"] }
leafwing-input-manager = { version = "0.21.0", default-features = false, features = ["keyboard"] }

[lints]
workspace = true

[dev-dependencies]
